name: PulsePipe V2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi uvicorn pydantic pydantic-settings python-multipart pyjwt

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/ -v

      - name: Run Hard Evals Gate
        run: |
          python -m evals.run_evals

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build
